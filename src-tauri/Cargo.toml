[package]
name = "daylight"
version = "0.1.0"
description = "朝夕 · Daylight calendar"
authors = ["Daylight contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "daylight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false }
